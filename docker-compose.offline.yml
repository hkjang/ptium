name: ptium

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ptium}
      POSTGRES_USER: ${POSTGRES_USER:-ptium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ptium-postgres:/var/lib/postgresql/data

  ptium:
    image: ptium-${PTIUM_VERSION:-0.1.0}:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ptium}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ptium}?sslmode=disable
      HTTP_ADDR: :8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      BOOTSTRAP_ADMIN_SUBJECTS: ${BOOTSTRAP_ADMIN_SUBJECTS:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ptium-web}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-ptium-web}
      OIDC_ALLOW_HTTP: ${OIDC_ALLOW_HTTP:-false}
      AUTH_ADMIN_ROLES: ${AUTH_ADMIN_ROLES:-ptium-admin,admin}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-}
      DEV_AUTH_EMAIL: ${DEV_AUTH_EMAIL:-}
      DEV_AUTH_NAME: ${DEV_AUTH_NAME:-}
      DEV_AUTH_ROLES: ${DEV_AUTH_ROLES:-user}
      DEV_AUTH_ALLOW_REMOTE: ${DEV_AUTH_ALLOW_REMOTE:-false}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PTIUM_PORT:-8080}:8080"

volumes:
  ptium-postgres:
