name: ptium

# Air-gapped deployment. The release bundle carries only the Ptium image, so
# PostgreSQL is supplied by the environment: set DATABASE_URL to a reachable
# cluster before starting.
services:
  ptium:
    image: ptium-${PTIUM_VERSION:-0.45.0}:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your PostgreSQL DSN in .env}
      HTTP_ADDR: :8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      BOOTSTRAP_ADMIN_SUBJECTS: ${BOOTSTRAP_ADMIN_SUBJECTS:-}
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Ptium Administrator}
      BOOTSTRAP_ADMIN_PASSWORD_RESET: ${BOOTSTRAP_ADMIN_PASSWORD_RESET:-false}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-12h}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ptium-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-ptium-web}
      OIDC_ALLOW_HTTP: ${OIDC_ALLOW_HTTP:-false}
      AUTH_ADMIN_ROLES: ${AUTH_ADMIN_ROLES:-ptium-admin,admin}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-}
      DEV_AUTH_EMAIL: ${DEV_AUTH_EMAIL:-}
      DEV_AUTH_NAME: ${DEV_AUTH_NAME:-}
      DEV_AUTH_ROLES: ${DEV_AUTH_ROLES:-user}
      DEV_AUTH_ALLOW_REMOTE: ${DEV_AUTH_ALLOW_REMOTE:-false}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:-}
      # Uploaded images: "database" keeps them in PostgreSQL (one thing to back
      # up), "filesystem" writes them to the volume below.
      ASSET_STORAGE: ${ASSET_STORAGE:-database}
      ASSET_DIR: /var/lib/ptium/assets
    volumes:
      # Harmless with ASSET_STORAGE=database and already there when you switch.
      - ptium-assets:/var/lib/ptium/assets
    ports:
      - "${PTIUM_PORT:-8080}:8080"

volumes:
  ptium-assets:
