    get:
      operationId: listAPIKeys
      summary: List API keys owned by the current user
      description: Key secrets are never included in list responses.
      tags: [API keys]
      x-ptium-api-key-scopes: [api_keys:manage]
      responses:
        '200':
          description: API-key metadata ordered newest first.
          headers:
