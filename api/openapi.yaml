      x-ptium-admin: true
      x-ptium-api-key-scopes: [admin:errors]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Incidents ordered by most recent occurrence.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/errors/{id}:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IncidentID'
    patch:
      operationId: updateAdminError
      summary: Acknowledge, resolve, or ignore a server incident
      tags: [Administration]
      x-ptium-admin: true
      x-ptium-api-key-scopes: [admin:errors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentUpdate'
      responses:
        '200':
          description: Updated incident.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /mcp:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/MCPProtocolVersion'
    get:
      operationId: getMCPMetadata
      summary: Get stateless MCP endpoint metadata
      description: |
        Returns diagnostic metadata for normal HTTP clients. A request whose
        `Accept` header specifically asks for `text/event-stream` receives 405
        because this stateless server does not expose an SSE stream.
      tags: [MCP]
      x-ptium-api-key-scopes: [mcp:use]
      parameters:
        - name: Accept
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: MCP transport metadata. This is not a REST envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: SSE streams are not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCErrorResponse'
    post:
      operationId: sendMCPMessage
      summary: Send a JSON-RPC 2.0 MCP message
      description: |
        Implements stateless MCP Streamable HTTP. Supported methods are
        `initialize`, `notifications/initialized`, `notifications/cancelled`,
        `ping`, `tools/list`, `tools/call`, `resources/list`, and
        `resources/read`. JSON-RPC batches are accepted only with protocol
        revision `2025-03-26`, with at most 50 entries. Notifications receive a
        204 response. The endpoint has a 1 MiB default request limit.
      tags: [MCP]
      x-ptium-api-key-scopes: [mcp:use]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/JSONRPCRequest'
                - type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/JSONRPCRequest'
      responses:
        '200':
          description: JSON-RPC result or error; batches return an array.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/JSONRPCResponse'
                  - type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/JSONRPCResponse'
        '204':
          description: Notification accepted; no JSON-RPC response body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Unsupported protocol version, disallowed batch, or invalid transport request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Origin rejected by the MCP transport or authenticated account forbidden.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/JSONRPCErrorResponse'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: MCP message exceeds the configured body limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCErrorResponse'
        '415':
          description: Content-Type is not JSON or a JSON-derived media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCErrorResponse'
        '500':
          description: Transport-level internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OIDC JWT or ptium_* API key
      description: |
        Send `Authorization: Bearer <credential>`. The credential may be an
        OIDC access-token JWT validated through issuer discovery and rotating
        JWKS, or an opaque Ptium API key beginning with `ptium_`.
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Alternative header for a Ptium `ptium_*` API key. Do not send it
        together with Authorization. The key must grant the scope named by the
        operation's `x-ptium-api-key-scopes` extension.
    DevSecret:
      type: apiKey
      in: header
      name: X-Ptium-Dev-Secret
      description: |
        Development-only shared secret. It is disabled by default, normally
        restricted to loopback clients, and may be renamed by server
        configuration. A Bearer value beginning `dev:` may accompany it to
        select an allowed development identity.

  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Caller-generated correlation ID. Values longer than 128 characters are replaced.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records. Values above 100 are clamped to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      description: Zero-based record offset.
      schema:
        type: integer
        minimum: 0
        default: 0
    PresentationID:
      name: id
      in: path
      required: true
      description: Presentation UUID.
      schema:
        type: string
        format: uuid
    SlidePosition:
      name: position
      in: path
      required: true
      description: 1-based position of the slide within the deck.
      schema:
        type: integer
        minimum: 1
    TemplateID:
      name: id
      in: path
      required: true
      description: Template UUID.
      schema:
        type: string
        format: uuid
    PreviewWidth:
      name: width
      in: query
      required: false
      description: Rendered pixel width. The height follows the slide aspect ratio.
      schema:
        type: integer
        minimum: 160
        maximum: 1920
        default: 960
    APIKeyID:
      name: id
      in: path
      required: true
      description: API-key record UUID, not the secret or prefix.
      schema:
        type: string
        format: uuid
    UserID:
      name: id
      in: path
      required: true
      description: Ptium user UUID.
      schema:
        type: string
        format: uuid
    IncidentID:
      name: id
      in: path
      required: true
      description: Captured incident UUID.
      schema:
        type: string
        format: uuid
    SettingKey:
      name: key
      in: path
      required: true
      description: Dotted lowercase setting key.
      schema:
        type: string
        maxLength: 100
        pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
        example: generation.default_theme
    MCPProtocolVersion:
      name: MCP-Protocol-Version
      in: header
      required: false
      description: Defaults to `2025-03-26` when omitted on POST.
      schema:
        type: string
        enum: ['2025-03-26', '2025-06-18', '2025-11-25']

  headers:
    XRequestID:
      description: Correlation ID used by logs, errors, and administrator incidents.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    BadRequest:
      description: Malformed, oversized, trailing, or multi-value JSON; unknown fields; an invalid UUID path ID; or invalid transport input.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidJSON:
              value:
                error:
                  code: invalid_json
                  message: Request body is not valid for this operation
                  details:
                    reason: 'json: unknown field "unexpected"'
                requestId: 8dcb8033f7d1f8027f2df88d
            invalidUUID:
              value:
                error:
                  code: invalid_id
                  message: Path id must be a UUID
                requestId: 8dcb8033f7d1f8027f2df88d
    Unauthorized:
      description: A credential is absent, invalid, expired, or revoked.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
            example: Bearer realm="ptium"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: authentication_required
              message: Unauthorized
            requestId: 8dcb8033f7d1f8027f2df88d
    Forbidden:
      description: The account is disabled or the API key lacks the operation's required scope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            insufficientScope:
              value:
                error:
                  code: insufficient_scope
                  message: The API key does not grant this operation
                  details:
                    required: presentations:write
                requestId: 8dcb8033f7d1f8027f2df88d
            disabled:
              value:
                error:
                  code: account_disabled
                  message: This account has been disabled
                requestId: 8dcb8033f7d1f8027f2df88d
    AdminForbidden:
      description: Administrator access or the required administrator API-key scope is absent.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: admin_required
              message: Administrator access is required
            requestId: 8dcb8033f7d1f8027f2df88d
    NotFound:
      description: The record does not exist or is not owned by the current user.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: not_found
              message: The requested resource was not found
            requestId: 8dcb8033f7d1f8027f2df88d
    Conflict:
      description: Current resource state conflicts with the requested operation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            emptyPresentation:
              value:
                error:
                  code: presentation_has_no_slides
                  message: Generate or add slides before exporting
                requestId: 8dcb8033f7d1f8027f2df88d
            selfAdministration:
              value:
                error:
                  code: cannot_disable_self
                  message: Administrators cannot disable or demote their own active account
                requestId: 8dcb8033f7d1f8027f2df88d
    UnprocessableEntity:
      description: Syntactically valid input failed operation validation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            fieldValidation:
              value:
                error:
                  code: validation_error
                  message: requestedSlideCount must be between 1 and 50
                requestId: 8dcb8033f7d1f8027f2df88d
            settingValidation:
              value:
                error:
                  code: validation_error
                  message: API key grace must be a duration between zero and 30 days
                  details:
                    key: security.api_key_grace
                requestId: 8dcb8033f7d1f8027f2df88d
            settingRelationship:
              value:
                error:
                  code: validation_error
                  message: generation default slide count cannot exceed the maximum
                requestId: 8dcb8033f7d1f8027f2df88d
    InternalError:
      description: An unexpected server or database error. The error is captured for administrators.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: internal_error
              message: The server could not complete the request
            requestId: 8dcb8033f7d1f8027f2df88d
    ServiceUnavailable:
      description: PostgreSQL readiness or the configured authentication backend is unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: database_unavailable
              message: Database is not ready
            requestId: 8dcb8033f7d1f8027f2df88d

  schemas:
    JSONValue:
      description: Any valid JSON value.

    RequestID:
      type: string
      minLength: 1
      maxLength: 128
      example: 8dcb8033f7d1f8027f2df88d

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          $ref: '#/components/schemas/APIError'
        requestId:
          $ref: '#/components/schemas/RequestID'

    APIError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          description: Stable machine-readable code. Internal operation failures may use operation-specific codes.
        message:
          type: string
          minLength: 1
        details:
          $ref: '#/components/schemas/JSONValue'

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0

    HealthEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, service, time]
          properties:
            status:
              type: string
              const: ok
            service:
              type: string
              const: ptium
            time:
              type: string
              format: date-time
        requestId:
          $ref: '#/components/schemas/RequestID'

    ReadinessEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              const: ready
        requestId:
          $ref: '#/components/schemas/RequestID'

    AuthConfigEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/AuthConfig'
        requestId:
          $ref: '#/components/schemas/RequestID'

    AuthConfig:
      type: object
      additionalProperties: false
      required: [oidcEnabled, scopes, pkceRequired, devAuthEnabled]
      properties:
        oidcEnabled:
          type: boolean
        issuer:
          type: string
          format: uri
        clientId:
          type: string
        authorizationEndpoint:
          type: string
          format: uri
        tokenEndpoint:
          type: string
          format: uri
        endSessionEndpoint:
          type: string
          format: uri
          description: Optional provider logout endpoint discovered from OIDC metadata.
        scopes:
          type: string
          example: openid profile email
        pkceRequired:
          type: boolean
        devAuthEnabled:
          type: boolean
        passwordLoginEnabled:
          type: boolean
          description: |
            True when at least one local account can sign in with a password, so
            a client should offer the username and password form.
        tokenExchangeUrl:
          type: string
          description: |
            Where to exchange an OIDC authorization code. Present only when Ptium
            performs the exchange server-side, which a confidential client
            requires; otherwise the client uses `tokenEndpoint` directly.
        devAuthHeader:
          type: string
          example: X-Ptium-Dev-Secret

    MeEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user, authMethod, scopes]
          properties:
            user:
              $ref: '#/components/schemas/User'
            authMethod:
              type: string
              enum: [oidc, api_key, dev, session]
            scopes:
              type: array
              items:
                type: string
              uniqueItems: true
        requestId:
          $ref: '#/components/schemas/RequestID'

    User:
      type: object
      additionalProperties: false
      required: [id, email, name, roles, isAdmin, disabled, lastLogin, createdAt, updatedAt]
      properties:
        hasPassword:
          type: boolean
          description: |
            True for an account that signs in with a password rather than through
            the identity provider. Such an account can change its own password.
        id:
          type: string
          format: uuid
        subject:
          type: string
          description: OIDC subject or development subject. May be omitted when empty.
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        isAdmin:
          type: boolean
        disabled:
          type: boolean
        presentationsCount:
          type: integer
          minimum: 0
          description: |
            Exact number of presentations currently owned by this user. This
            field is populated by the administrator user-list operation and
            may be omitted from other user responses or when the count is zero.
        lastLogin:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/User'
        requestId:
          $ref: '#/components/schemas/RequestID'

    UserListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        requestId:
          $ref: '#/components/schemas/RequestID'

    AdminUserUpdate:
      type: object
      additionalProperties: false
      properties:
        isAdmin:
          type: boolean
        disabled:
          type: boolean

    Profile:
      type: object
      additionalProperties: false
      required: [userId, displayName, company, jobTitle, bio, preferences, updatedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 120
        company:
          type: string
          maxLength: 200
        jobTitle:
          type: string
          maxLength: 200
        bio:
          type: string
          maxLength: 4000
          description: Free-form personalization context used by presentation workflows.
        preferences:
          $ref: '#/components/schemas/JSONValue'
        updatedAt:
          type: string
          format: date-time

    ProfileWrite:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          maxLength: 120
          default: ''
        company:
          type: string
          maxLength: 200
          default: ''
        jobTitle:
          type: string
          maxLength: 200
          default: ''
        bio:
          type: string
          maxLength: 4000
          default: ''
        preferences:
          $ref: '#/components/schemas/JSONValue'
      example:
        displayName: Mina Kim
        company: Ptium Labs
        jobTitle: Product strategist
        bio: Builds concise executive narratives.
        preferences:
          preferredLanguage: ko
          preferredTheme: aurora

    ProfileEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/Profile'
        requestId:
          $ref: '#/components/schemas/RequestID'

    PublicSettingsEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          propertyNames:
            pattern: '^(branding|generation|service)\.'
          additionalProperties:
            $ref: '#/components/schemas/JSONValue'
          example:
            branding.product_name: Ptium
            branding.brand_color: '#7C3AED'
            generation.default_slide_count: 10
            generation.max_slides: 50
            generation.default_theme: aurora
            generation.default_lang: ko
            service.version: 1.6.4
        requestId:
          $ref: '#/components/schemas/RequestID'

    PresentationStatus:
      type: string
      enum: [draft, queued, generating, completed, failed]

    Presentation:
      type: object
      additionalProperties: false
      required:
        - id
        - ownerId
        - title
        - prompt
        - status
        - theme
        - language
        - audience
        - tone
        - requestedSlideCount
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        prompt:
          type: string
          maxLength: 20000
          description: REST writes allow 12000 characters; MCP creation allows 20000.
        status:
          $ref: '#/components/schemas/PresentationStatus'
        templateId:
          type: string
          format: uuid
          description: |
            PowerPoint template the deck is generated into and exported from.
            Populated automatically from the requested theme when the caller
            does not choose one.
        templateName:
          type: string
          description: Read-only display name of the selected template.
        generationNotes:
          type: array
          readOnly: true
          items:
            type: string
          description: |
            What generation did differently from what was asked, written in the
            deck's own language for the person who asked. The usual case is a
            deck shorter than the requested slide count: a brief naming one
            subject cannot fill twenty slides without repeating pages, and
            saying so is better than padding. Empty when the deck is what was
            requested.
        theme:
          type: string
          minLength: 1
          maxLength: 80
        language:
          type: string
          minLength: 1
          maxLength: 32
        audience:
          type: string
          minLength: 1
          maxLength: 300
        tone:
          type: string
          minLength: 1
          maxLength: 80
        requestedSlideCount:
          type: integer
          minimum: 1
          maximum: 50
        slideCount:
          type: integer
          minimum: 0
          description: |
            Exact number of persisted slides at response time. List responses
            populate this count even though they omit the `slides` array. The
            field may be omitted when the count is zero.
        outline:
          $ref: '#/components/schemas/JSONValue'
        errorMessage:
          type: string
        slides:
          type: array
          items:
            $ref: '#/components/schemas/Slide'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic resource version used to reject stale writes.
        deletedAt:
          type: string
          format: date-time
          description: Present only for a deck in the recycle bin.
        generationStartedAt:
          type: string
          format: date-time
        generationEndedAt:
          type: string
          format: date-time

    PresentationCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          default: Untitled presentation
        prompt:
          type: string
          maxLength: 12000
          default: ''
        templateId:
          type: string
          format: uuid
          description: |
            Template to generate into. Omission selects the built-in design that
            matches `theme`. The template must be owned by the caller, shared
            with the organisation, or built in.
        theme:
          type: string
          minLength: 1
          maxLength: 80
          description: Omission uses the administrator-configured generation default (initially `aurora`).
        language:
          type: string
          minLength: 1
          maxLength: 32
          description: Omission uses the administrator-configured generation default (initially `ko`).
        audience:
          type: string
          minLength: 1
          maxLength: 300
          description: Omission uses the administrator-configured generation default (initially `general`).
        tone:
          type: string
          minLength: 1
          maxLength: 80
          description: Omission uses the administrator-configured generation default (initially `professional`).
        requestedSlideCount:
          type: integer
          minimum: 1
          maximum: 50
          description: Omission uses the administrator-configured default (initially 10); the configured maximum may be lower than 50.
      example:
        title: 2027 Product Strategy
        prompt: Create an executive decision deck for regional leaders.
        theme: aurora
        language: en
        audience: Regional leadership
        tone: concise
        requestedSlideCount: 10

    PresentationUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        prompt:
          type: string
          maxLength: 12000
        templateId:
          type: [string, 'null']
          format: uuid
          description: |
            Switch the deck to another template. Slides keep their content; each
            one rebinds to the layout of the same role in the new design.
        theme:
          type: string
          minLength: 1
          maxLength: 80
        language:
          type: string
          minLength: 1
          maxLength: 32
        audience:
          type: string
          minLength: 1
          maxLength: 300
        tone:
          type: string
          minLength: 1
          maxLength: 80
        requestedSlideCount:
          type: integer
          minimum: 1
          maximum: 50
          description: The administrator-configured generation maximum may be lower than 50.
        slides:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SlideWrite'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Optional expected version. A stale value returns HTTP 409.

    SlideWrite:
      type: object
      additionalProperties: false
      required: [content]
      description: |
        The title must be provided either in `title` or as `content.title`.
        Array order, not `position`, determines the persisted order.
      properties:
        id:
          type: string
          format: uuid
          description: Existing slide UUID. Omit for a newly inserted slide.
        position:
          type: integer
          minimum: 1
          deprecated: true
          description: Accepted but ignored; array order is authoritative.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Falls back to `content.title` when absent or empty.
        subtitle:
          type: string
          maxLength: 300
          description: Falls back to `content.subtitle` when absent or empty.
        content:
          $ref: '#/components/schemas/SlideContent'
        speakerNotes:
          type: string
          maxLength: 4000
          description: Falls back to `content.speaker_notes` when absent or empty.
        layout:
          type: string
          maxLength: 80
        layoutId:
          type: string
          maxLength: 80
          description: |
            Template layout to bind the slide to. Unknown identifiers fall back
            to the layout matching the slide's narrative role.
          default: content
      example:
        layout: content
        content:
          title: Why change now
          subtitle: Three market signals
          body: Customer expectations are moving faster than our release cycle.
          bullets: [Faster adoption, New entrants, Lower switching costs]
          speaker_notes: Pause after the customer example.

    Slide:
      type: object
      additionalProperties: false
      required: [id, presentationId, position, title, content, layout, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        presentationId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
        title:
          type: string
        subtitle:
          type: string
        content:
          $ref: '#/components/schemas/SlideContent'
        speakerNotes:
          type: string
        layout:
          type: string
          description: Narrative role of the slide, for example `title`, `content` or `closing`.
        layoutId:
          type: string
          maxLength: 80
          description: Identifier of the template layout this slide is bound to.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Template:
      type: object
      additionalProperties: false
      required: [id, name, kind, scope, sizeBytes, layoutCount, createdAt, updatedAt]
      description: |
        A PowerPoint design decks are generated into. Export reuses the stored
        package itself — master, layouts, theme, fonts and imagery are carried
        over unchanged and only the slides are rewritten.
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: [string, 'null']
          format: uuid
          description: Absent for built-in designs.
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        filename:
          type: string
        kind:
          type: string
          enum: [builtin, uploaded]
        tags:
          type: array
          items:
            type: string
          description: |
            What the design looks like and what it is for — light or dark, how it
            is composed, the kind of meeting it was drawn for. Derived when the
            template is read rather than stored, so it follows the design.
        dark:
          type: boolean
          description: True when the template paints on a dark surface.
        scope:
          type: string
          enum: [private, shared]
        paletteKey:
          type: string
          description: Palette identifier of a built-in design; matches the deck `theme` value.
        sizeBytes:
          type: integer
          minimum: 0
        checksum:
          type: string
          description: SHA-256 of the stored package.
        layoutCount:
          type: integer
          minimum: 0
        aspectRatio:
          type: string
          example: '16:9'
        usageCount:
          type: integer
          description: How many of the caller's own decks were built on this design.
        favorite:
          type: boolean
          description: Starred by the caller.
        lastUsed:
          type: string
          format: date-time
          description: When the caller last saved a deck built on it. List responses only.
        manifest:
          $ref: '#/components/schemas/TemplateManifest'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TemplateManifest:
      type: object
      description: |
        Machine-readable analysis of the package, produced on upload. Slide
        dimensions are in English Metric Units. Omitted from list responses.
      properties:
        version:
          type: integer
        slideWidth:
          type: integer
        slideHeight:
          type: integer
        aspectRatio:
          type: string
        masterCount:
          type: integer
        hasNotesMaster:
          type: boolean
        sourceSlides:
          type: integer
          description: Slides in the uploaded file. They are discarded when generating.
        defaultLayout:
          type: string
        titleLayout:
          type: string
        sectionLayout:
          type: string
        closingLayout:
          type: string
        theme:
          type: object
          properties:
            name: { type: string }
            colors:
              type: object
              additionalProperties: { type: string }
            majorLatin: { type: string }
            minorLatin: { type: string }
            majorEa: { type: string }
            minorEa: { type: string }
        layouts:
          type: array
          items:
            $ref: '#/components/schemas/TemplateLayout'
        warnings:
          type: array
          items: { type: string }

    TemplateLayout:
      type: object
      required: [id, name, role, placeholders]
      properties:
        id:
          type: string
          description: Stable identifier used by `Slide.layoutId`.
        name:
          type: string
          description: Layout name as authored in PowerPoint.
        role:
          type: string
          enum: [title, section, content, twoContent, comparison, quote, picture, table, chart, closing, blank]
          description: Narrative role inferred from the layout's name, type and placeholder composition.
        type:
          type: string
          description: Raw OOXML layout type.
        background:
          type: string
          description: Resolved background colour as RRGGBB.
        placeholders:
          type: array
          items:
            $ref: '#/components/schemas/TemplatePlaceholder'

    TemplatePlaceholder:
      type: object
      required: [slot, kind, maxChars, maxLines]
      properties:
        slot:
          type: string
          description: Canonical slot name — `title`, `subtitle`, `body`, `body2`, `picture`, `chart`, `table`.
          example: body
        kind:
          type: string
          enum: [text, picture, chart, table, graphic]
        type:
          type: string
          description: Raw OOXML placeholder type.
        index:
          type: integer
        region:
          type: string
          description: Position on the canvas, for example `left-middle`.
        fontSize:
          type: integer
          description: Effective first-level font size in hundredths of a point.
        maxChars:
          type: integer
          description: Mixed-script character budget for the slot.
        maxLines:
          type: integer
        x: { type: integer }
        y: { type: integer }
        width: { type: integer }
        height: { type: integer }
        color:
          type: string
        bold:
          type: boolean
        font:
          type: string

    TemplateUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        scope:
          type: string
          enum: [private, shared]

    TemplateEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/Template'
        requestId:
          $ref: '#/components/schemas/RequestID'

    TemplateListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          type: array
          description: List records omit `manifest`; read a single template for its layouts.
          items:
            $ref: '#/components/schemas/Template'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        requestId:
          $ref: '#/components/schemas/RequestID'

    SessionEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [access_token, token_type, expires_in]
          properties:
            access_token:
              type: string
              description: |
                Browser session token, prefixed `ptses_`. The same value is set as
                the HttpOnly `ptium_session` cookie, which is what a browser should
                rely on: it survives closing the tab, is invisible to scripts, and
                is renewed automatically once past half its life. A scripted client
                may instead send it as `Authorization: Bearer <token>`.

                The token is stateless and signed, and stops working when the
                account's password changes.
            token_type:
              type: string
              enum: [Bearer]
            expires_in:
              type: integer
              description: Seconds until the token expires.
            user:
              $ref: '#/components/schemas/User'
        requestId:
          $ref: '#/components/schemas/RequestID'

    AssetListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        requestId:
          $ref: '#/components/schemas/RequestID'

    GridSpec:
      type: object
      description: |
        A grid component an organisation defined. It names colour roles rather
        than colours, so one definition works in every template.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,39}$'
          description: How deck source refers to it.
        title:
          type: string
          description: Shown above the grid when the source supplies no caption.
        columns:
          type: array
          maxItems: 8
          items:
            type: object
            properties:
              label:
                type: string
              weight:
                type: number
                description: The column's share of the width, relative to the others.
              align:
                type: string
                enum: [l, ctr, r]
        values:
          type: object
          description: How each cell value is drawn, keyed by the value as written.
          additionalProperties:
            type: object
            properties:
              label:
                type: string
              role:
                type: string
                enum: [accent1, accent2, accent3, accent4, accent5, accent6, positive, negative, muted, ink]
              chip:
                type: boolean
                description: Draw the value in a filled pill rather than as coloured text.
              meaning:
                type: string
                description: Shown in the legend.
        order:
          type: array
          items:
            type: string
          description: The legend's reading order; "R, A, C, I" is not alphabetical.
        zebra:
          type: boolean
        legend:
          type: boolean

    DeckScore:
      type: object
      description: |
        The same measurements, scored. A list of findings answers "what should I
        fix"; the score answers "is this ready", which is the question people ask
        first. Every slide starts at a hundred and pays the weight of what was
        measured on it; a dimension is the average of the slides in that
        dimension, and the deck's total is the average of its slides.

        The score measures the drawing, not the argument. A deck of well-set
        slides saying nothing scores a hundred.
      properties:
        total:
          type: integer
          description: 0-100, the average of the deck's slide scores.
        dimensions:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                enum: [readability, structure, visual, accessibility, evidence]
              score:
                type: integer
              counted:
                type: integer
                description: How many findings this dimension stands on, so a low score can be traced.
        slides:
          type: array
          items:
            type: object
            properties:
              slide:
                type: integer
              score:
                type: integer
              worst:
                type: string
                description: The kind of the heaviest finding on the slide.
        weakest:
          type: integer
          description: The slide to open first. Zero when every slide measured clean.
    DeckFinding:
      type: object
      description: One defect measured in a drawn slide.
      properties:
        slide:
          type: integer
        slot:
          type: string
          description: The template region the defect is in.
        kind:
          type: string
          enum: [overflow, outside, collision, contrast, orphan, density, notes]
        detail:
          type: string
          description: What is wrong, in numbers the author can act on.
        advisory:
          type: boolean
          description: |
            True for a slide that is drawn correctly and could still be better, as
            opposed to one drawn wrong. `clean` refers to the defects only.

    Asset:
      type: object
      description: An image a deck can place on a slide.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: What deck source calls this image.
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/svg+xml]
        sizeBytes:
          type: integer
        width:
          type: integer
          description: Pixels; absent for an SVG, which is stretched to its frame.
        height:
          type: integer
        checksum:
          type: string
        tags:
          type: array
          description: The owner's own words for what the image is for.
          items:
            type: string
        favorite:
          type: boolean
          description: Starred by its owner; starred images lead every ordering.
        deckCount:
          type: integer
          description: |
            How many of the owner's decks place this image. Counted from the
            decks themselves whenever slides are saved, so removing an image from
            a deck lowers it at once.
        lastUsed:
          type: string
          format: date-time
        reused:
          type: boolean
          description: Present on an upload that matched an image already stored.
        createdAt:
          type: string
          format: date-time

    Comment:
      type: object
      description: >
        One remark about one slide, left by someone reviewing the deck. The
        author is a name they typed, not an account.
      properties:
        id: { type: string, format: uuid }
        presentationId: { type: string, format: uuid }
        slideId: { type: string, format: uuid }
        author: { type: string }
        body: { type: string }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Share:
      type: object
      description: >
        A link that opens one deck read-only. The token is not part of it: the
        link is returned once, when it is made, and stored only as a digest.
      properties:
        id: { type: string, format: uuid }
        presentationId: { type: string, format: uuid }
        label: { type: string }
        url:
          type: string
          description: The address to hand to a person. Present only in the response that made it.
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        views: { type: integer }
        createdAt: { type: string, format: date-time }

    Snippet:
      type: object
      description: |
        A slide someone saved to use again, kept as deck source so that inserting
        it lays it out in the destination deck's template.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source:
          type: string
          description: The slide as deck source.
        role:
          type: string
          description: The kind of slide it was saved from.
        tags:
          type: array
          items:
            type: string
        favorite:
          type: boolean
        useCount:
          type: integer
          description: How many times it has been inserted.
        lastUsed:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SlideContent:
      type: object
      description: |
        A slide's payload. `fields` maps a template slot to its paragraphs;
        `blocks` maps a slot to a visual component drawn in it. A slot holds
        either paragraphs or a component, never both. Unknown keys are ignored,
        so clients may round-trip content they do not understand.

        Updating a slide without mentioning `blocks`, `images`, `elements`, `frames`
        or `styles` keeps whatever the slide already carries: a client that only
        edits text cannot delete the components, pictures and layout a generated
        deck is largely made of. Send `"blocks": {}`, `"images": {}`,
        `"elements": []`, `"frames": {}` or `"styles": {}` to clear them.
      properties:
        type:
          type: string
          enum: [template]
        title:
          type: string
          description: Legacy title field accepted from simple clients; template-aware clients should use `fields.title`.
        subtitle:
          type: string
          description: Legacy subtitle field accepted from simple clients.
        body:
          type: string
          description: Legacy prose field accepted from simple clients.
        speaker_notes:
          type: string
          description: Legacy notes field accepted from simple clients.
        layoutId:
          type: string
          description: Template layout the slide is bound to.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SlideParagraph'
          description: Slot name to paragraphs, for example `title`, `subtitle`, `body`, `body2`.
        blocks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SlideBlock'
          description: Slot name to the component drawn in that slot.
        images:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SlideContentImage'
          description: Slot name to the asset drawn in that template slot.
        elements:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SlideElement'
          description: Freely positioned objects layered above the template, in z-index order.
        frames:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SlotFrame'
          description: |
            Where a template region draws on this slide, when the author moved or
            resized it on the canvas. A slot with no entry keeps the layout's own
            geometry, so a deck stays inside its template until a region is
            deliberately dragged somewhere else. The layout itself is untouched.
        styles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SlotStyle'
          description: |
            How a template region's text is set on this slide, where the author
            changed it. A slot with no entry keeps the template's own type, and a
            style states only what changed. Applies to a region's words; a
            component draws its own type from the template's design system.
        bullets:
          type: array
          items:
            type: string
          description: Read-only mirror of the primary body slot, kept for simple clients.
        accent:
          type: string
          description: Brand colour applied to the slide, as `#RRGGBB`.

    SlotFrame:
      type: object
      required: [x, y, width, height]
      description: |
        Where something draws on a slide, in percentages of the slide — the only
        unit a browser and a PPTX can both be given without conversion.
      properties:
        x: { type: number, minimum: -100, maximum: 200 }
        y: { type: number, minimum: -100, maximum: 200 }
        width: { type: number, minimum: 1, maximum: 300 }
        height: { type: number, minimum: 1, maximum: 300 }

    SlotStyle:
      type: object
      description: |
        What a slide changes about one region's type. Every field is optional: an
        author who only centres a line has not also chosen its size. The typeface
        is deliberately not settable — a deck with three typefaces in it is an
        accident rather than a design.
      properties:
        scale:
          type: number
          minimum: 0.4
          maximum: 3
          description: Multiplies the template's own size. Absent means unchanged.
        color:
          type: string
          description: RRGGBB.
        bold: { type: boolean }
        italic: { type: boolean }
        align:
          type: string
          enum: [left, center, right, justify]

    CanvasRegion:
      type: object
      required: [slot, kind, frame, layout, moved, acceptsText]
      description: |
        One region of a drawn slide, described for an editor rather than for the
        renderer. This is what makes generated content editable rather than a
        picture: the title a model wrote and a text box someone added answer the
        same click.
      properties:
        slot:
          type: string
        kind:
          type: string
          enum: [text, component, picture, empty]
        frame:
          $ref: '#/components/schemas/SlotFrame'
        layout:
          allOf:
            - $ref: '#/components/schemas/SlotFrame'
          description: Where the template puts the region, which is what "reset" restores.
        moved:
          type: boolean
        text:
          type: string
          description: The region's paragraphs, joined by newlines, with two spaces per outline level.
        paragraphs:
          type: array
          items:
            $ref: '#/components/schemas/SlideParagraph'
        block:
          $ref: '#/components/schemas/SlideBlock'
        image:
          $ref: '#/components/schemas/SlideContentImage'
        fontSize:
          type: number
          description: Point size the template gives the region's text.
        bold: { type: boolean }
        italic: { type: boolean }
        align:
          type: string
          description: DrawingML alignment, present only where the slide overrides it.
        style:
          allOf:
            - $ref: '#/components/schemas/SlotStyle'
          description: What this slide changed about the region's type, if anything.
        color: { type: string }
        font: { type: string }
        name: { type: string }
        prompt: { type: string }
        acceptsText:
          type: boolean
          description: False for a region that holds a picture and nothing else.
        spannedBy:
          type: string
          description: Set when a component placed in another slot covers this region.

    SlideParagraph:
      type: object
      required: [text]
      properties:
        text:
          type: string
        level:
          type: integer
          minimum: 0
          maximum: 4
          description: Outline depth; 1 and deeper are sub-bullets.

    SlideContentImage:
      type: object
      required: [assetId]
      properties:
        assetId:
          type: string
        name:
          type: string
        caption:
          type: string

    SlideElement:
      type: object
      required: [id, kind, x, y, width, height]
      description: |
        An editable object layered over the template. Geometry is expressed as
        percentages of the slide, then converted to DrawingML EMUs for PPTX.
      properties:
        id:
          type: string
          maxLength: 100
        kind:
          type: string
          enum: [text, shape, line, image, table]
        shape:
          type: string
          enum: [rect, roundRect, ellipse, triangle, diamond, rightArrow, star5, hexagon, line]
        x:
          type: number
          minimum: -100
          maximum: 200
        y:
          type: number
          minimum: -100
          maximum: 200
        width:
          type: number
          exclusiveMinimum: 0
          maximum: 300
        height:
          type: number
          exclusiveMinimum: 0
          maximum: 300
        rotation:
          type: number
          minimum: -3600
          maximum: 3600
        zIndex:
          type: integer
          minimum: -10000
          maximum: 10000
        text:
          type: string
          maxLength: 20000
        cells:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
              maxLength: 1000
          description: Rectangular cell matrix required when `kind` is `table`.
        headerRows:
          type: integer
          minimum: 0
          maximum: 50
        headerColumns:
          type: integer
          minimum: 0
          maximum: 20
        fontFamily:
          type: string
          maxLength: 200
        fontSize:
          type: number
          minimum: 0
          maximum: 400
        textColor:
          type: string
        bold: { type: boolean }
        italic: { type: boolean }
        underline: { type: boolean }
        align:
          type: string
          enum: [left, center, right, justify]
        verticalAlign:
          type: string
          enum: [top, middle, bottom]
        fill: { type: string }
        stroke: { type: string }
        strokeWidth:
          type: number
          minimum: 0
          maximum: 50
        startArrow:
          type: string
          enum: [none, triangle, stealth, diamond, oval]
        endArrow:
          type: string
          enum: [none, triangle, stealth, diamond, oval]
        dash:
          type: string
          enum: [solid, dash, dot, dashDot]
        opacity:
          type: integer
          minimum: 0
          maximum: 100
        assetId:
          type: string
          description: Required when `kind` is `image`.
        name: { type: string }
        caption:
          type: string
          maxLength: 1000
        fit:
          type: string
          enum: [cover, contain, fill]
        groupId:
          type: string
          maxLength: 100
        locked: { type: boolean }
        hidden: { type: boolean }

    SlideBlock:
      type: object
      required: [kind]
      description: |
        A visual component drawn from the template's own palette and
        typography. Only the keys a kind needs are used; the renderer drops a
        component that carries too little to draw and falls back to prose.

        Data-bearing kinds (`kpi`, `hero`, `meter`, `columnChart`, `barChart`,
        `lineChart`, `shareBar`) must be given real figures. Structural kinds
        (`steps`, `timeline`, `comparison`, `table`, `quote`, `callout`) carry
        meaning without them.
      properties:
        kind:
          type: string
          enum: [bullets, kpi, hero, steps, timeline, comparison, columnChart,
                 barChart, lineChart, shareBar, meter, table, quote, callout]
        heading:
          type: string
          maxLength: 80
        text:
          type: string
          maxLength: 300
          description: The single statement a `quote` or `callout` is built around.
        attribute:
          type: string
          maxLength: 80
          description: Source of a `quote`.
        caption:
          type: string
          maxLength: 160
          description: Footnote under the component.
        unit:
          type: string
          maxLength: 8
          description: Suffix appended to numeric values, for example `%`.
        emphasis:
          type: integer
          minimum: 0
          description: 1-based item to highlight; every other mark recedes to grey.
        items:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/SlideBlockItem'
        series:
          type: array
          maxItems: 3
          description: Line-chart series.
          items:
            type: object
            required: [points]
            properties:
              name:
                type: string
              points:
                type: array
                items:
                  type: number
        labels:
          type: array
          items:
            type: string
          description: Axis labels for a line chart.
        columns:
          type: array
          items:
            type: string
          description: Table header cells.
        rows:
          type: array
          items:
            type: array
            items:
              type: string
          description: Table body rows.

    SlideBlockItem:
      type: object
      properties:
        label:
          type: string
          maxLength: 60
        value:
          type: string
          maxLength: 24
          description: Display text for the value; overrides `number` when set.
        number:
          type: number
          description: Numeric weight used for bars, shares and meters.
        delta:
          type: string
          maxLength: 24
        trend:
          type: string
          enum: [up, down, flat]
          description: Direction of the delta, which decides its colour.
        detail:
          type: string
          maxLength: 120
        bullets:
          type: array
          maxItems: 4
          items:
            type: string

    PresentationRevision:
      type: object
      additionalProperties: false
      required: [id, presentationId, version, reason, title, slideCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        presentationId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          enum: [edit, source, generation, restore]
        title:
          type: string
        slideCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time

    PresentationEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/Presentation'
        requestId:
          $ref: '#/components/schemas/RequestID'

    PresentationListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          type: array
          description: List records omit `slides`; use each record's `slideCount` for the exact persisted count.
          items:
            $ref: '#/components/schemas/Presentation'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        requestId:
          $ref: '#/components/schemas/RequestID'

    PresentationRevisionListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PresentationRevision'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        requestId:
          $ref: '#/components/schemas/RequestID'

    APIKeyScope:
      type: string
      description: |
        API-key authorization capability. `presentations:read` permits listing,
        fetching, and exporting the owner's decks; `presentations:write`
        permits creating, updating, deleting, and generating them. `mcp:use`
        permits access to `/mcp` but does not replace the presentation scope
        required by each MCP tool. `profile:read` and `profile:write` cover the
        owner's profile, and `api_keys:manage` covers the owner's API keys.
        `templates:read` permits listing, reading, downloading and previewing
        templates; `templates:write` permits uploading, editing and deleting the
        owner's own templates.
        Each `admin:*` scope additionally requires that the owning account is
        still an administrator when the operation runs.
      enum:
        - presentations:read
        - presentations:write
        - templates:read
        - templates:write
        - profile:read
        - profile:write
        - mcp:use
        - api_keys:manage
        - admin:settings
        - admin:users
        - admin:errors

    APIKey:
      type: object
      additionalProperties: false
      required: [id, userId, name, prefix, scopes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        prefix:
          type: string
          pattern: '^[0-9a-f]{12}$'
          description: Non-secret lookup prefix suitable for identifying a key.
        scopes:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/APIKeyScope'
        expiresAt:
          type: string
          format: date-time
          description: Creation accepts a future expiry no more than two years from the current time.
        revokedAt:
          type: string
          format: date-time
        rotatedToId:
          type: string
          format: uuid
          description: Replacement key record created by rotation. Present on the superseded key.
        graceUntil:
          type: string
          format: date-time
          description: End of the overlap period when this old key stops authenticating.
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    APIKeyCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/APIKeyScope'
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future and no more than two years from creation.
      example:
        name: CI presentation generator
        scopes: [presentations:read, presentations:write, mcp:use]
        expiresAt: '2027-01-31T00:00:00Z'

    APIKeyRotate:
      type: object
      additionalProperties: false
      properties:
        gracePeriod:
          type: string
          description: Go duration from zero through 30 days, such as `24h` or `30m`. Omission uses the administrator-configured grace period (initially 24h).
          pattern: '^(?:0|[0-9]+(?:\.[0-9]+)?(?:ns|us|µs|ms|s|m|h)(?:[0-9]+(?:\.[0-9]+)?(?:ns|us|µs|ms|s|m|h))*)$'
        graceSeconds:
          type: integer
          minimum: 0
          maximum: 2592000
          description: Grace period in seconds; overrides `gracePeriod` when present.

    APIKeyCreated:
      type: object
      additionalProperties: false
      required: [apiKey, secret]
      properties:
        apiKey:
          $ref: '#/components/schemas/APIKey'
        secret:
          type: string
          readOnly: true
          pattern: '^ptium_[0-9a-f]{12}_[A-Za-z0-9_-]{43}$'
          description: One-time secret. It is never stored in recoverable form or returned again.

    APIKeyListEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/APIKey'
        requestId:
          $ref: '#/components/schemas/RequestID'

    APIKeyCreatedEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/APIKeyCreated'
        requestId:
          $ref: '#/components/schemas/RequestID'

    Setting:
      type: object
      additionalProperties: false
      required: [key, sensitive, configured, updatedAt]
      properties:
        key:
          type: string
          maxLength: 100
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
        value:
          $ref: '#/components/schemas/JSONValue'
        sensitive:
          type: boolean
        configured:
          type: boolean
        unreadable:
          type: boolean
          description: >-
            A sensitive value the server can no longer decrypt, which is what a
            changed encryption key or database URL leaves behind. The setting has
            to be entered again; the rest of the page still works.
        description:
          type: string
        updatedBy:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
      description: The `value` property is omitted for sensitive settings.

    SettingText1To200:
      type: string
      minLength: 1
      maxLength: 200

    SettingHTTPURL:
      type: string
      format: uri
      pattern: '^https?://'
      description: HTTP(S) URL with a host and without credentials, query, or fragment.

    SettingHTTPURLOrEmpty:
      description: Empty string or an HTTP(S) URL with a host and without credentials, query, or fragment.
      oneOf:
        - type: string
          const: ''
        - $ref: '#/components/schemas/SettingHTTPURL'

    SettingHTTPSURLOrEmpty:
      description: Empty string or an HTTPS URL with a host and without credentials, query, or fragment.
      oneOf:
        - type: string
          const: ''
        - type: string
          format: uri
          pattern: '^https://'

    SettingSlideCount:
      type: integer
      minimum: 1
      maximum: 50

    SettingAdminRoles:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
        maxLength: 100

    SettingGraceDuration:
      type: string
      pattern: '^(?:0|[0-9]+(?:\.[0-9]+)?(?:ns|us|µs|ms|s|m|h)(?:[0-9]+(?:\.[0-9]+)?(?:ns|us|µs|ms|s|m|h))*)$'
      description: Go duration between zero and 30 days.

    SettingCORSOrigins:
      type: array
      items:
        type: string
        format: uri
        pattern: '^https?://'
      description: Exact HTTP(S) origins with no credentials, query, fragment, or non-root path.

    SettingUpdateRecord:
      type: object
      additionalProperties: false
      required: [key, value]
      description: |
        Known built-in keys are validated by type and domain. In addition,
        `generation.default_slide_count` cannot exceed
        `generation.max_slides`, and a non-empty `auth.oidc.issuer_url`
        requires a non-empty `auth.oidc.client_id` in the resulting settings.
      properties:
        key:
          type: string
          maxLength: 100
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
        value:
          $ref: '#/components/schemas/JSONValue'
        sensitive:
          type: boolean
          default: false
        description:
          type: string
      allOf:
        - if:
            properties:
              key:
                const: ai.provider
          then:
            properties:
              value:
                type: string
                enum: [fallback, openai, openai-compatible]
        - if:
            properties:
              key:
                const: ai.base_url
          then:
            properties:
              value:
                $ref: '#/components/schemas/SettingHTTPURL'
        - if:
            properties:
              key:
                const: ai.reasoning
          then:
            properties:
              value:
                type: string
                enum: [auto, off, on]
        - if:
            properties:
              key:
                const: ai.max_output_tokens
          then:
            properties:
              value:
                type: integer
                minimum: 500
                maximum: 32000
        - if:
            properties:
              key:
                const: ai.timeout_seconds
          then:
            properties:
              value:
                type: integer
                minimum: 10
                maximum: 3600
        - if:
            properties:
              key:
                enum: [ai.model, branding.product_name, generation.default_theme, generation.default_lang, generation.default_tone, generation.default_audience]
          then:
            properties:
              value:
                $ref: '#/components/schemas/SettingText1To200'
        - if:
            properties:
              key:
                const: branding.brand_color
          then:
            properties:
              value:
                type: string
                pattern: '^#[0-9A-Fa-f]{6}$'
        - if:
            properties:
              key:
                const: branding.logo_url
          then:
            properties:
              value:
                $ref: '#/components/schemas/SettingHTTPURLOrEmpty'
        - if:
            properties:
              key:
                const: auth.oidc.issuer_url
          then:
            properties:
              value:
                $ref: '#/components/schemas/SettingHTTPSURLOrEmpty'
        - if:
            properties:
              key:
                const: auth.oidc.client_id
          then:
            properties:
              value:
                type: string
        - if:
            properties:
              key:
                const: auth.oidc.admin_roles
          then:
            properties:
              value:
                $ref: '#/components/schemas/SettingAdminRoles'
        - if:
            properties:
              key:
                const: generation.repair_passes
          then:
            properties:
              value:
                type: integer
                minimum: 0
                maximum: 10
        - if:
            properties:
              key:
                enum: [generation.default_slide_count, generation.max_slides]
          then:
            properties:
              value:
                $ref: '#/components/schemas/SettingSlideCount'
        - if:
            properties:
              key:
                const: security.api_key_grace
          then:
            properties:
              value:
                $ref: '#/components/schemas/SettingGraceDuration'
        - if:
            properties:
              key:
                const: security.cors_origins
          then:
            properties:
              value:
                $ref: '#/components/schemas/SettingCORSOrigins'

    SettingValueWrite:
      type: object
      additionalProperties: false
      required: [value]
      description: The server applies the same built-in-key and cross-setting validation documented by `SettingUpdateRecord`, using the path key.
      properties:
        value:
          $ref: '#/components/schemas/JSONValue'
        sensitive:
          type: boolean
          default: false
          description: Secret-like key names are always treated as sensitive regardless of this value.
        description:
          type: string
      example:
        value: gpt-4.1-mini
        sensitive: false
        description: Generation model

    SettingValueMap:
      type: object
      minProperties: 1
      properties:
        ai.provider:
          type: string
          enum: [fallback, openai, openai-compatible]
        ai.base_url:
          $ref: '#/components/schemas/SettingHTTPURL'
        ai.model:
          $ref: '#/components/schemas/SettingText1To200'
        ai.reasoning:
          type: string
          enum: [auto, off, on]
          description: >-
            How to handle a reasoning model. `auto` asks the provider not to think
            and retries without the field if it is refused, `off` always asks, `on`
            leaves the model's own default alone.
        ai.max_output_tokens:
          type: integer
          minimum: 500
          maximum: 32000
        ai.timeout_seconds:
          type: integer
          minimum: 10
          maximum: 3600
        branding.product_name:
          $ref: '#/components/schemas/SettingText1To200'
        branding.logo_url:
          $ref: '#/components/schemas/SettingHTTPURLOrEmpty'
        branding.brand_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        generation.default_slide_count:
          $ref: '#/components/schemas/SettingSlideCount'
        generation.max_slides:
          $ref: '#/components/schemas/SettingSlideCount'
        generation.default_theme:
          $ref: '#/components/schemas/SettingText1To200'
        generation.default_lang:
          $ref: '#/components/schemas/SettingText1To200'
        generation.default_tone:
          $ref: '#/components/schemas/SettingText1To200'
        generation.default_audience:
          $ref: '#/components/schemas/SettingText1To200'
        generation.repair_passes:
          type: integer
          minimum: 0
          maximum: 10
          description: |
            How many slides a generation may measure against the template and
            send back to the model to be rewritten so they fit. A rewrite is kept
            only when it measures better than what it replaced. 0 turns the pass
            off, which is the setting for a deployment paying per token.
        auth.oidc.issuer_url:
          $ref: '#/components/schemas/SettingHTTPSURLOrEmpty'
        auth.oidc.client_id:
          type: string
        auth.oidc.admin_roles:
          $ref: '#/components/schemas/SettingAdminRoles'
        security.api_key_grace:
          $ref: '#/components/schemas/SettingGraceDuration'
        security.cors_origins:
          $ref: '#/components/schemas/SettingCORSOrigins'
      additionalProperties:
        $ref: '#/components/schemas/JSONValue'

    SettingUpdateList:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/SettingUpdateRecord'

    SettingsBatchWrite:
      type: object
      additionalProperties: false
      required: [settings]
      properties:
        section:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
          description: Optional prefix for bare keys in an object-form update.
        settings:
          oneOf:
            - $ref: '#/components/schemas/SettingUpdateList'
            - $ref: '#/components/schemas/SettingValueMap'
      examples:
        - section: generation
          settings:
            default_theme: aurora
            default_lang: ko
        - settings:
            - key: ai.api_key
              value: replace-me
              sensitive: true

    SettingEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/Setting'
        requestId:
          $ref: '#/components/schemas/RequestID'

    SettingListEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
        requestId:
          $ref: '#/components/schemas/RequestID'

    SettingBatchEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Setting'
        requestId:
          $ref: '#/components/schemas/RequestID'

    AdminOverview:
      type: object
      additionalProperties: false
      required: [users, presentations, completedDecks, queuedGenerations, openIncidents, activeApiKeys]
      properties:
        users:
          type: integer
          minimum: 0
        presentations:
          type: integer
          minimum: 0
        completedDecks:
          type: integer
          minimum: 0
        queuedGenerations:
          type: integer
          minimum: 0
        openIncidents:
          type: integer
          minimum: 0
        activeApiKeys:
          type: integer
          minimum: 0

    AdminOverviewEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/AdminOverview'
        requestId:
          $ref: '#/components/schemas/RequestID'

    IncidentStatus:
      type: string
      enum: [open, acknowledged, resolved, ignored]

    Incident:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - severity
        - message
        - status
        - occurredAt
        - updatedAt
        - fingerprint
        - occurrenceCount
        - firstOccurredAt
        - lastOccurredAt
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
        userId:
          type: string
          format: uuid
        kind:
          type: string
          example: request
        severity:
          type: string
          example: error
        message:
          type: string
          description: Redacted server-side diagnostic message.
        details:
          $ref: '#/components/schemas/JSONValue'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        notes:
          type: string
          maxLength: 4000
        occurredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        resolvedBy:
          type: string
          format: uuid
        fingerprint:
          type: string
          description: Stable grouping fingerprint for repeated open incidents.
        occurrenceCount:
          type: integer
          minimum: 1
        firstOccurredAt:
          type: string
          format: date-time
        lastOccurredAt:
          type: string
          format: date-time

    IncidentUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/IncidentStatus'
        notes:
          type: [string, 'null']
          maxLength: 4000
          description: Omit this field (or send `null`) to preserve the current notes; send an empty string to clear them.

    IncidentEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/Incident'
        requestId:
          $ref: '#/components/schemas/RequestID'

    IncidentListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        requestId:
          $ref: '#/components/schemas/RequestID'

    MCPMetadata:
      type: object
      additionalProperties: false
      required: [name, version, transport, protocolVersion, authentication, sessionsSupported]
      properties:
        name:
          type: string
          example: ptium
        version:
          type: string
          example: 0.1.0
        transport:
          type: string
          const: streamable-http
        protocolVersion:
          type: string
          const: '2025-11-25'
        authentication:
          type: string
          const: required
        sessionsSupported:
          type: boolean
          const: false

    JSONRPCID:
      oneOf:
        - type: string
        - type: number
        - type: 'null'

    JSONRPCRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          $ref: '#/components/schemas/JSONRPCID'
        method:
          type: string
          enum:
            - initialize
            - notifications/initialized
            - notifications/cancelled
            - ping
            - tools/list
            - tools/call
            - resources/list
            - resources/read
        params:
          anyOf:
            - $ref: '#/components/schemas/MCPInitializeParams'
            - $ref: '#/components/schemas/MCPToolsCallParams'
            - $ref: '#/components/schemas/MCPResourceListParams'
            - $ref: '#/components/schemas/MCPResourceReadParams'
            - type: object
              additionalProperties: true
            - type: array
              items:
                $ref: '#/components/schemas/JSONValue'
          description: Method-specific MCP parameters. Canonical method schemas are defined below.
      example:
        jsonrpc: '2.0'
        id: 1
        method: initialize
        params:
          protocolVersion: '2025-11-25'
          capabilities: {}
          clientInfo:
            name: example
            version: '1.0'

    JSONRPCResultResponse:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, result]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          $ref: '#/components/schemas/JSONRPCID'
        result:
          anyOf:
            - $ref: '#/components/schemas/MCPInitializeResult'
            - $ref: '#/components/schemas/MCPToolResult'
            - $ref: '#/components/schemas/MCPResourceListResult'
            - $ref: '#/components/schemas/MCPResourceReadResult'
            - $ref: '#/components/schemas/JSONValue'

    JSONRPCError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: integer
          description: JSON-RPC or Ptium server error code.
          examples: [-32700, -32600, -32601, -32602, -32603, -32000, -32001, -32002, -32003, -32009]
        message:
          type: string
        data:
          $ref: '#/components/schemas/JSONValue'

    JSONRPCErrorResponse:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, error]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          $ref: '#/components/schemas/JSONRPCID'
        error:
          $ref: '#/components/schemas/JSONRPCError'
      example:
        jsonrpc: '2.0'
        id: null
        error:
          code: -32600
          message: Invalid Request

    JSONRPCResponse:
      oneOf:
        - $ref: '#/components/schemas/JSONRPCResultResponse'
        - $ref: '#/components/schemas/JSONRPCErrorResponse'

    MCPInitializeParams:
      type: object
      required: [protocolVersion]
      properties:
        protocolVersion:
          type: string
        capabilities:
          type: object
          additionalProperties: true
        clientInfo:
          type: object
          additionalProperties: true
        _meta:
          type: object
          additionalProperties: true

    MCPInitializeResult:
      type: object
      additionalProperties: false
      required: [protocolVersion, capabilities, serverInfo, instructions]
      properties:
        protocolVersion:
          type: string
          enum: ['2025-03-26', '2025-06-18', '2025-11-25']
        capabilities:
          type: object
          additionalProperties: false
          required: [tools, resources]
          properties:
            tools:
              type: object
              additionalProperties: false
              required: [listChanged]
              properties:
                listChanged:
                  type: boolean
                  const: false
            resources:
              type: object
              additionalProperties: false
              required: [subscribe, listChanged]
              properties:
                subscribe:
                  type: boolean
                  const: false
                listChanged:
                  type: boolean
                  const: false
        serverInfo:
          type: object
          additionalProperties: false
          required: [name, title, version]
          properties:
            name:
              type: string
            title:
              type: string
              const: Ptium AI Presentations
            version:
              type: string
        instructions:
          type: string

    MCPToolName:
      type: string
      enum:
        - ptium.list_presentations
        - ptium.get_presentation
        - ptium.create_presentation
        - ptium.generate_presentation

    MCPListPresentationsArguments:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0

    MCPPresentationIDArguments:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128

    MCPCreatePresentationArguments:
      type: object
      additionalProperties: false
      required: [title, prompt]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        theme:
          type: string
          maxLength: 64
          description: Omission uses the administrator-configured generation theme (initially `aurora`).
        language:
          type: string
          maxLength: 32
          description: Omission uses the administrator-configured generation language (initially `ko`).
        audience:
          type: string
          maxLength: 200
          description: Omission uses the administrator-configured generation audience (initially `general`).
        tone:
          type: string
          maxLength: 64
          description: Omission uses the administrator-configured generation tone (initially `professional`).
        slideCount:
          type: integer
          minimum: 1
          maximum: 50
          description: Omission uses the current `generation.default_slide_count` setting; the configured maximum may be lower than 50.

    MCPToolsCallParams:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/MCPToolName'
        arguments:
          oneOf:
            - $ref: '#/components/schemas/MCPListPresentationsArguments'
            - $ref: '#/components/schemas/MCPPresentationIDArguments'
            - $ref: '#/components/schemas/MCPCreatePresentationArguments'
        _meta:
          type: object
          additionalProperties: true

    MCPToolContent:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          type: string
          description: JSON serialization of `structuredContent`.

    MCPToolResult:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MCPToolContent'
        structuredContent:
          $ref: '#/components/schemas/JSONValue'
        isError:
          type: boolean
          description: Present and true for validation, authorization, ownership, timeout, and redacted service failures.

    MCPResourceListParams:
      type: object
      additionalProperties: false
      properties:
        cursor:
          type: string
          description: Opaque base64url cursor returned by the previous page.
        _meta:
          type: object
          additionalProperties: true

    MCPResourceReadParams:
      type: object
      additionalProperties: false
      required: [uri]
      properties:
        uri:
          type: string
          pattern: '^ptium://presentations/[^/]+$'
        _meta:
          type: object
          additionalProperties: true

    MCPResource:
      type: object
      additionalProperties: false
      required: [uri, name, title, description, mimeType]
      properties:
        uri:
          type: string
          pattern: '^ptium://presentations/[^/]+$'
        name:
          type: string
        title:
          type: string
        description:
          type: string
        mimeType:
          type: string
          const: application/json
        annotations:
          type: object
          additionalProperties: false
          properties:
            audience:
              type: array
              items:
                type: string
                enum: [user, assistant]
            lastModified:
              type: string
              format: date-time

    MCPResourceListResult:
      type: object
      additionalProperties: false
      required: [resources]
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/MCPResource'
        nextCursor:
          type: string

    MCPResourceReadResult:
      type: object
      additionalProperties: false
      required: [contents]
      properties:
        contents:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [uri, mimeType, text]
            properties:
              uri:
                type: string
                pattern: '^ptium://presentations/[^/]+$'
              mimeType:
                type: string
                const: application/json
              text:
                type: string
                description: JSON-encoded Presentation object including slides.
