openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Ptium API
  version: 0.1.0
  summary: AI presentation generation, administration, and MCP API
  description: |
    Ptium exposes owner-scoped presentation generation, profile and API-key
    management, administrator operations, and a stateless MCP endpoint.

    JSON REST responses use an envelope containing either `data` or `error`
    plus `requestId`. List responses additionally contain `meta`. The `/mcp`
    endpoint uses raw JSON-RPC 2.0 messages and does not use the REST envelope.

    JSON request bodies are limited to 2 MiB, reject unknown top-level fields,
    and must contain exactly one complete JSON value. UUID path parameters are
    validated before their operation handler runs.

    OIDC access tokens and Ptium API keys are both accepted as Bearer
    credentials. Ptium API keys may alternatively be sent in `X-API-Key`.
    Development authentication is disabled by default and uses
    `X-Ptium-Dev-Secret` unless the server is configured with another header.

    The `x-ptium-api-key-scopes` extension on an operation names the scope a
    Ptium API key must grant. Interactive OIDC and development sessions are
    not restricted by API-key scopes. MCP API-key calls always require
    `mcp:use`; each presentation tool additionally requires its documented
    `presentations:read` or `presentations:write` scope.
servers:
  - url: /
    description: Same origin as the Ptium web application
tags:
  - name: System
    description: Process health and database readiness.
  - name: Authentication
    description: Public OIDC discovery values and current-user identity.
  - name: Profile
    description: Current-user personalization data.
  - name: Settings
    description: Public runtime values and administrator configuration.
  - name: Presentations
    description: Owner-scoped deck creation, editing, generation, and export.
  - name: Templates
    description: PowerPoint designs decks are generated into, with their layout catalogues.
  - name: API keys
    description: Scoped credentials, revocation, and rotation with overlap.
  - name: Administration
    description: Administrator settings, users, overview, and incident handling.
  - name: MCP
    description: Stateless Model Context Protocol transport, tools, and resources.
security:
  - BearerAuth: []
  - APIKeyHeader: []
  - DevSecret: []
paths:
  /healthz:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [System]
      security: []
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'

  /readyz:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: getReadiness
      summary: Readiness probe
      tags: [System]
      security: []
      responses:
        '200':
          description: Ptium and its PostgreSQL database are ready.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/config:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: getAuthenticationConfig
      summary: Get public authentication configuration
      description: |
        Returns browser-safe OIDC discovery values and the development-auth
        status. Secrets are never returned. OIDC login uses Authorization Code
        with PKCE when `oidcEnabled` is true.
      tags: [Authentication]
      security: []
      responses:
        '200':
          description: Public authentication configuration.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigEnvelope'

  /api/v1/auth/login:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    post:
      operationId: passwordLogin
      summary: Sign in a local account with a password
      description: |
        Exchanges a username and password for a browser session token. Available
        when `passwordLoginEnabled` is true in the public auth config, which is
        the case once a local account exists — normally the bootstrap
        administrator seeded from the environment.

        Repeated failures back off per client address; a throttled caller
        receives 429 with a `Retry-After` header. The response never reveals
        whether the username exists.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username:
                  type: string
                  minLength: 1
                  description: The account's username or email address.
                password:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: A session token and the signed-in account.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The username or password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The account is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: This deployment does not accept password sign-in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          description: Too many sign-in attempts from this client.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/password:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    post:
      operationId: changePassword
      summary: Change the signed-in account's password
      description: |
        Replaces the password after confirming the current one. Every session
        token issued before the change stops working, so the response carries a
        fresh token for the caller while other browsers are signed out.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 256
      responses:
        '200':
          description: Password changed; a replacement session token is returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '204':
          description: Password changed, but no replacement token could be issued.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The account signs in through the identity provider and has no password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/token:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    post:
      operationId: exchangeOIDCToken
      summary: Exchange an OIDC authorization code
      description: |
        Completes the Authorization Code + PKCE exchange on the browser's behalf.
        A confidential client's secret must never reach a single-page app, so
        Ptium presents it to the identity provider itself. The public auth config
        advertises this path as `tokenExchangeUrl` when it is available; a public
        client exchanges the code with the provider directly instead.

        The refresh token the provider returns is deliberately not forwarded.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [code, redirect_uri, code_verifier]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code]
                code:
                  type: string
                redirect_uri:
                  type: string
                code_verifier:
                  type: string
      responses:
        '200':
          description: The provider's token response, without any refresh token.
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  id_token:
                    type: string
                  scope:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The identity provider rejected the exchange.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: This deployment does not exchange tokens server-side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    post:
      operationId: signOut
      summary: End the browser session
      description: |
        Expires the session cookie. The cookie is HttpOnly, so a browser cannot
        clear it itself. Always succeeds, whether or not the session was still
        valid — signing out must never fail.

        A bearer token is not revoked by this call; discard it client-side.
      tags: [Authentication]
      security: []
      responses:
        '204':
          description: The session cookie has been expired.

  /api/v1/auth/session:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    post:
      operationId: startSession
      summary: Trade the current identity for a session cookie
      description: |
        Issues a Ptium session for an already authenticated caller and returns it
        as a `Set-Cookie` as well as in the body.

        This is how a workspace stops depending on the identity provider's access
        token, which lives minutes and whose refresh token deliberately never
        reaches the browser. A Ptium session is renewed while its holder keeps
        working, so an active person is not signed out mid-task.

        An API key is refused: a server-to-server credential does not become a
        browser session.
      tags: [Authentication]
      responses:
        '200':
          description: A session token and the signed-in account.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: An API key cannot open a browser session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: This deployment does not issue session cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: getCurrentUser
      summary: Get the current user and authentication context
      tags: [Authentication]
      responses:
        '200':
          description: Current Ptium identity.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/profile:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: getProfile
      summary: Get the current user's personalization profile
      tags: [Profile]
      x-ptium-api-key-scopes: [profile:read]
      responses:
        '200':
          description: Personalization profile.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceProfile
      summary: Replace the current user's personalization profile
      description: Omitted fields are stored as empty strings and preferences default to an empty object.
      tags: [Profile]
      x-ptium-api-key-scopes: [profile:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileWrite'
      responses:
        '200':
          description: Updated personalization profile.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProfile
      summary: Update the current user's personalization profile
      description: |
        This endpoint currently has the same replacement behavior as PUT;
        omitted scalar fields are cleared and omitted preferences become `{}`.
      tags: [Profile]
      x-ptium-api-key-scopes: [profile:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileWrite'
      responses:
        '200':
          description: Updated personalization profile.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/settings:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: getPublicSettings
      summary: Get public branding and generation settings
      description: >-
        Returns only non-sensitive `branding.*` and `generation.*` settings, plus
        `service.version` — the build the server is running. Authentication is not
        required.
      tags: [Settings]
      security: []
      responses:
        '200':
          description: Public runtime settings keyed by dotted setting name.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSettingsEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/assets:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: listAssets
      summary: List the images available to a deck
      description: |
        Images a deck can place on its slides. Bytes are not included; fetch one
        image to read them.

        The list is a person's own library, so it answers the four ways anyone
        looks for a picture: starred, recently used, most used, or by name.
        Starred images lead every ordering.
      tags: [Presentations]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Matches the name or any tag.
          schema:
            type: string
        - name: tag
          in: query
          description: Only images carrying this tag.
          schema:
            type: string
        - name: favorite
          in: query
          description: Only starred images.
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, lastUsed, used, name]
            default: recent
      responses:
        '200':
          description: The caller's images.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAsset
      summary: Upload an image
      description: |
        Stores an image a deck can place with `::image <name>`. The format is
        read from the bytes rather than the filename, and a second upload under a
        name that already exists replaces it — so a logo is changed in one place.

        PNG, JPEG, GIF and SVG are accepted, up to 16 MiB each.

        Uploading bytes already in the library returns that image with
        `reused: true` and status 200 rather than storing it twice.
      tags: [Presentations]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                  description: What deck source calls the image. Defaults to the filename.
      responses:
        '200':
          description: The library already held these bytes; this is that image.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Asset'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '201':
          description: The stored image.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Asset'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: The image is larger than this deployment accepts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Not an image format Ptium can place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/assets/{id}:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: getAsset
      summary: Read an image
      tags: [Presentations]
      responses:
        '200':
          description: The image's bytes.
          headers:
            ETag:
              description: The image's content hash; the bytes never change for an id.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAsset
      summary: Rename or retag an image
      description: |
        The name is what deck source calls the picture, so it stays unique per
        person; decks hold the id and keep working across a rename. Tags are the
        owner's own words, at most eight.
      tags: [Presentations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: The updated image.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Asset'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another image of theirs already has that name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteAsset
      summary: Remove an image
      description: |
        A deck that still references the image keeps its slide; the picture is
        simply not drawn, and compiling its source reports the missing name.
      tags: [Presentations]
      responses:
        '204':
          description: The image has been removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/assets/tags:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: listAssetTags
      summary: List the tags the caller files images under
      description: |
        Each tag with how many images carry it, most used first, so a picker can
        offer the words this person already writes.
      tags: [Presentations]
      responses:
        '200':
          description: The caller's tags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        count:
                          type: integer
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/assets/{id}/favorite:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    put:
      operationId: favoriteAsset
      summary: Star or unstar an image
      tags: [Presentations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite:
                  type: boolean
      responses:
        '200':
          description: The image, with its new state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Asset'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/templates/{id}/favorite:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    put:
      operationId: favoriteTemplate
      summary: Star or unstar a design for the caller
      description: |
        A note about the caller's own workspace: it needs no write access to the
        template and changes nobody else's copy. Starred designs lead the
        library and weigh on what is recommended.
      tags: [Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite:
                  type: boolean
      responses:
        '200':
          description: The design's new state for this caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      favorite:
                        type: boolean
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/presentations/import:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    post:
      operationId: importPresentation
      summary: Read a presentation or a document into a new deck
      description: |
        Turns what someone already has into a Ptium deck: a presentation, or the
        material one would be written from.

        A `.pptx` or `.potx` is read as a deck. One Ptium exported carries the
        text it was written from, and comes back exactly as it was written —
        components, citations and speaker notes included — unless it has been
        edited elsewhere since, in which case the edit wins and the file is read
        from its shapes like any other.

        A `.xlsx`, `.csv`, `.tsv`, `.docx`, `.md` or `.txt` is read as material.
        A sheet becomes one slide — a chart when it is one column of labels and
        one of figures, a table otherwise — and a report's headings become
        slides with their sentences as points. Every slide a document produces
        cites the file and the place in it, as a `!source` line, because the
        first question asked of a figure is where it came from and retyping is
        where that answer is usually lost.

        A `.pdf` is refused: extracting its text needs a parser this deployment
        does not carry.

        For a presentation: turns a deck someone already has into a Ptium deck. Titles, points (at the
        depth they were written), speaker notes and tables come across, along with
        the kind of each slide; the text is then compiled into the chosen template,
        so an old deck can be redrawn in a new design.

        Pictures are carried too: each is stored in the caller's image library and
        placed in the new design's picture region. Where it sat is not carried —
        coordinates chosen for one layout mean nothing in another — and a picture
        repeated on most slides (a logo) or too small to be the point of the slide
        is left out. Charts are not carried; the response says how many there
        were.
      tags: [Presentations]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                templateId:
                  type: string
                  format: uuid
                  description: The design to redraw it in. Defaults to the caller's own.
                name:
                  type: string
                  description: Defaults to the file's own title.
                language:
                  type: string
      responses:
        '201':
          description: The imported deck.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      presentation:
                        $ref: '#/components/schemas/Presentation'
                      slides:
                        type: integer
                      warnings:
                        type: array
                        description: |
                          What the import did with the file, for the person who
                          uploaded it: pictures placed, tables redrawn, charts left
                          behind.
                        items:
                          type: string
                      notes:
                        type: array
                        description: |
                          What binding the text to the template adjusted, for
                          whoever is debugging a template.
                        items:
                          type: string
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: The file is larger than this deployment accepts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Not a PowerPoint file, or one with no readable slides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/presentations/{id}/command:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    post:
      operationId: commandPresentation
      summary: Tell the deck what to do, in words
      description: |
        Reads a sentence into edits and performs them: merging, splitting,
        moving, duplicating, deleting slides, and trimming a deck to a number of
        slides or to a presentation length.

        No model is involved. Those edits have one right answer, so reading the
        sentence is faster and more reliable than asking a model to guess — and
        it works the same in a deployment with no provider at all. Rewriting a
        slide's words is the model's job and lives at `/rewrite`.

        `dryRun` returns the plan without changing anything. The plan says, in
        the language the sentence was typed in, what it understood — a command
        nobody can check is a command nobody should run. Applying writes a
        version checkpoint, so it can be undone from the deck's history.

        A trim drops the slides that measured worst, never the first or last,
        and says which ones it dropped. A merge carries the second slide's
        points, speaker notes and sources into the first.
      tags: [Presentations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: 3번과 4번 합쳐줘
                dryRun:
                  type: boolean
      responses:
        '200':
          description: What the command did, or would do.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      applied:
                        type: boolean
                      slides:
                        type: integer
                      slidesAfter:
                        type: integer
                      plan:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                              enum: [delete, move, duplicate, merge, split, trim]
                            slides:
                              type: array
                              items:
                                type: integer
                            to:
                              type: integer
                            count:
                              type: integer
                            reason:
                              type: string
                      notes:
                        type: array
                        items:
                          type: string
                      presentation:
                        $ref: '#/components/schemas/Presentation'
        '422':
          description: The sentence named no edit this endpoint performs.
  /api/v1/presentations/{id}/rewrite:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    post:
      operationId: rewritePresentation
      summary: Ask the model to rewrite a deck that already exists
      description: |
        Queues the deck for rewriting, the same way generation is queued: the
        worker tells the two apart by whether the deck already has text.

        The deck's facts are the author's and are kept — every number, name and
        claim reappears unchanged. What changes is the craft: titles that say what
        a slide argues, a lead that does not repeat the title, points that carry
        one idea, speaker notes where there were none, and components where the
        deck already states figures, a sequence or a table.

        The previous version stays in the deck's history, so a rewrite can be
        taken back.
      tags: [Presentations]
      responses:
        '202':
          description: The deck is queued for rewriting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Presentation'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The deck has nothing to rewrite, or this deployment has no AI provider
            configured. Rewriting is the one thing the offline writer cannot stand
            in for: it would replace the author's deck with a new one about the
            brief.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/snippets:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: listSnippets
      summary: List the caller's saved slides
      description: |
        Slides someone keeps to use again — the company introduction, the team
        page, the legal notice. Each is stored as deck source, so inserting one
        lays it out in the template of the deck it lands in.
      tags: [Presentations]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Matches the name, the source text or any tag.
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, lastUsed, used, name]
            default: recent
      responses:
        '200':
          description: The caller's saved slides.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Snippet'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createSnippet
      summary: Save a slide for reuse
      description: |
        Send `source` directly, or name a deck and a slide position and the
        server writes that slide down as source. Saving under a name that already
        exists replaces it, which is how the company introduction is updated.
      tags: [Presentations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Defaults to the slide's own title.
                tags:
                  type: array
                  items:
                    type: string
                source:
                  type: string
                presentationId:
                  type: string
                  format: uuid
                slide:
                  type: integer
                  description: 1-based position of the slide to save.
      responses:
        '201':
          description: The saved slide.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Snippet'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: There was nothing to save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/snippets/tags:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: listSnippetTags
      summary: List the tags the caller files saved slides under
      tags: [Presentations]
      responses:
        '200':
          description: The caller's tags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        count:
                          type: integer
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/snippets/{id}:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: getSnippet
      summary: Read a saved slide
      tags: [Presentations]
      responses:
        '200':
          description: The saved slide.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Snippet'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSnippet
      summary: Rename, retag or rewrite a saved slide
      tags: [Presentations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                source:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: The updated saved slide.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Snippet'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another saved slide already has that name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteSnippet
      summary: Remove a saved slide
      description: Decks it was inserted into are untouched; they hold ordinary slides.
      tags: [Presentations]
      responses:
        '204':
          description: The saved slide has been removed.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/snippets/{id}/favorite:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    put:
      operationId: favoriteSnippet
      summary: Star or unstar a saved slide
      tags: [Presentations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite:
                  type: boolean
      responses:
        '200':
          description: The saved slide, with its new state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Snippet'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/snippets/{id}/render:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    post:
      operationId: renderSnippet
      summary: Lay a saved slide out in a deck's template
      description: |
        Compiles the saved source against the named deck's template and returns
        the slide, ready to be inserted. The same saved page becomes a two-column
        slide in one design and a full-bleed one in another, which is the point
        of storing text rather than a drawing. Counts as a use.
      tags: [Presentations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presentationId]
              properties:
                presentationId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The compiled slide.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      slide:
                        $ref: '#/components/schemas/Slide'
                      warnings:
                        type: array
                        items:
                          type: string
                      name:
                        type: string
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The saved slide produced nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/snippets/{id}/preview.svg:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: previewSnippet
      summary: Draw a saved slide in a deck's design
      tags: [Presentations]
      parameters:
        - name: presentationId
          in: query
          description: The deck whose template to draw it in. Without one, the caller's default design is used.
          schema:
            type: string
            format: uuid
        - name: width
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: The slide as SVG.
          content:
            image/svg+xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/grids:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: listGrids
      summary: List grid definitions
      description: |
        The caller's own grid definitions, plus the shipped ones they have not
        replaced. A definition describes a component an organisation defines for
        itself — a RACI chart, a risk matrix — and deck source refers to it by name
        with `::grid <name>`.
      tags: [Presentations]
      responses:
        '200':
          description: The definitions available to this caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GridSpec'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createGrid
      summary: Save a grid definition
      tags: [Presentations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridSpec'
      responses:
        '200':
          description: The stored definition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GridSpec'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: The definition names a colour rather than a role, or is otherwise unusable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/grids/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,39}$'
      - $ref: '#/components/parameters/XRequestID'
    put:
      operationId: saveGrid
      summary: Save a grid definition under a name
      description: |
        A definition saved under the name of a shipped one replaces it, so deck
        source that already says `::grid raci` keeps working while the slide
        follows the organisation's own rules.
      tags: [Presentations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridSpec'
      responses:
        '200':
          description: The stored definition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GridSpec'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: The definition is unusable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteGrid
      summary: Remove a grid definition
      description: Removing an override restores the shipped definition of that name.
      tags: [Presentations]
      responses:
        '204':
          description: The definition has been removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/presentations:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: listPresentations
      summary: List presentations owned by the current user
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: deleted
          in: query
          schema: { type: boolean, default: false }
          description: When true, return only presentations in the recycle bin.
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: |
            Narrows the list to decks whose title or brief contains this text,
            case-insensitively. The count in the envelope is the number of
            matches, so a client can page through them.
      responses:
        '200':
          description: |
            Owner-scoped presentations ordered by most recently updated. A list
            omits each deck's source and outline — a deck that is opened is
            fetched on its own, with everything.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createPresentation
      summary: Create a draft presentation
      description: Missing fields use the documented defaults. Slides are added with an update request.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationCreate'
      responses:
        '201':
          description: Draft presentation created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/presentations/generate:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    post:
      operationId: createAndGeneratePresentation
      summary: Create a presentation and queue generation
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationCreate'
      responses:
        '202':
          description: Presentation created with generation queued.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/presentations/{id}:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
    get:
      operationId: getPresentation
      summary: Get a presentation and its slides
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:read]
      responses:
        '200':
          description: Presentation owned by the current user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replacePresentation
      summary: Update presentation metadata and optionally replace slides
      description: |
        Metadata fields are merged with the current presentation. When `slides`
        is present, the entire slide sequence is atomically replaced; array
        order determines the saved `position`.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationUpdate'
      responses:
        '200':
          description: Updated presentation including its current slides.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updatePresentation
      summary: Partially update presentation metadata or replace slides
      description: When `slides` is present, the entire sequence is replaced; array order is authoritative.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationUpdate'
      responses:
        '200':
          description: Updated presentation including its current slides.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deletePresentation
      summary: Move a presentation to the recycle bin
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      responses:
        '204':
          description: Presentation moved to the recycle bin. The response has no body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/presentations/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
    post:
      operationId: duplicatePresentation
      summary: Duplicate a presentation
      description: Creates an independent copy with new presentation and slide identifiers.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      responses:
        '201':
          description: Independent copy created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/presentations/{id}/shares:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
    get:
      operationId: listShares
      summary: List the links that open this deck
      description: >
        Every link made for this deck, open or closed. The tokens themselves are
        not returned: a link is shown once, when it is made.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:read]
      responses:
        '200':
          description: The links made for this deck.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Share'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createShare
      summary: Open this deck to whoever holds a link
      description: >
        Makes a link that shows this deck read-only, for someone who has no
        account here. The link is in the response and nowhere else: the token is
        stored as a digest, so it cannot be produced again. Set days to expire
        it, or leave it out to keep it open until it is revoked.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 120
                  description: What this link is for, so the owner can tell two apart.
                days:
                  type: integer
                  minimum: 0
                  maximum: 3650
                  description: Days until it stops working. Zero leaves it open until revoked.
      responses:
        '201':
          description: The link, shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Share'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/presentations/{id}/shares/{shareId}:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
      - name: shareId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeShare
      summary: Close a link
      description: The deck is untouched; the link stops working from now on.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      responses:
        '204':
          description: The link is closed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/shared/{token}:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: readSharedDeck
      summary: Read a deck someone shared a link to
      description: >
        No credentials. The deck's name and its slide titles, and nothing else —
        not its source, not its template, not the workspace it lives in. A link
        that was revoked or has expired answers 410.
      tags: [Presentations]
      security: []
      responses:
        '200':
          description: The shared deck.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      title: { type: string }
                      slideCount: { type: integer }
                      slides:
                        type: array
                        description: Each slide's name and the id a remark attaches itself to.
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            title: { type: string }
                      titles:
                        type: array
                        description: Deprecated; the titles alone, as the first viewer expected them.
                        items: { type: string }
                      language: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The link is no longer open.

  /api/v1/presentations/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
    get:
      operationId: listComments
      summary: What the people who read this deck said
      description: Every remark left through a share link, oldest first, with the slide each is about.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:read]
      responses:
        '200':
          description: The remarks left on this deck.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/presentations/{id}/comments/{commentId}/resolve:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: resolveComment
      summary: Mark a remark dealt with, or put it back
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                resolved: { type: boolean, default: true }
      responses:
        '204':
          description: The remark is marked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/presentations/{id}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteComment
      summary: Remove a remark
      description: The owner decides what stays on their deck. Nobody is notified.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      responses:
        '204':
          description: The remark is gone.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/shared/{token}/comments:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: readSharedComments
      summary: Read what has been said about a shared deck
      description: No credentials. Everyone holding the link is in the same conversation.
      tags: [Presentations]
      security: []
      responses:
        '200':
          description: The remarks on this deck.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The link is no longer open.
    post:
      operationId: leaveSharedComment
      summary: Say what is wrong with slide 4
      description: >
        A remark from someone who has no account here, under the name they type.
        The slide must belong to the deck the link opens. A deck holds 500
        remarks; past that this answers 429.
      tags: [Presentations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                slideId:
                  type: string
                  format: uuid
                  description: The slide it is about. Omit for a remark about the deck.
                author: { type: string, maxLength: 80 }
                body: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: The remark, as it was recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Comment'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The link is no longer open.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: This deck holds as many remarks as it will take.

  /api/v1/shared/{token}/preview.svg:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - name: token
        in: path
        required: true
        schema: { type: string }
      - name: slide
        in: query
        schema: { type: integer, minimum: 1 }
      - name: width
        in: query
        schema: { type: integer }
    get:
      operationId: readSharedSlide
      summary: Draw one slide of a shared deck
      description: The slide as the editor draws it, for whoever holds the link.
      tags: [Presentations]
      security: []
      responses:
        '200':
          description: The slide.
          content:
            image/svg+xml:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The link is no longer open.

  /api/v1/presentations/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
    post:
      operationId: restoreDeletedPresentation
      summary: Restore a presentation from the recycle bin
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      responses:
        '200':
          description: Restored presentation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/presentations/{id}/permanent:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
    delete:
      operationId: permanentlyDeletePresentation
      summary: Permanently delete a presentation from the recycle bin
      description: The operation succeeds only after the presentation has been moved to the recycle bin.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      responses:
        '204':
          description: Presentation and its revision history permanently deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/presentations/{id}/revisions:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
    get:
      operationId: listPresentationRevisions
      summary: List restorable presentation checkpoints
      description: Ordinary autosaves are coalesced into five-minute checkpoints; source, generation and restore transitions create explicit checkpoints.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Checkpoints ordered newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationRevisionListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/presentations/{id}/revisions/{revisionId}/changes:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
      - name: revisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: comparePresentationRevision
      summary: What changed between a version and the deck as it stands
      description: |
        Answers the question version history raises and does not answer: what is
        different about this checkpoint. The unit is the slide, because that is
        what a person edits in, and the lines that came and went are given in
        the deck's own language — the same text the source panel shows.

        Slides are matched by id, then by title, then in order, so a slide that
        was rewritten reads as one change rather than one deletion and one
        addition.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:read]
      responses:
        '200':
          description: What changed, slide by slide.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      slidesBefore: { type: integer }
                      slidesAfter: { type: integer }
                      changes:
                        type: array
                        items:
                          type: object
                          properties:
                            kind: { type: string, enum: [added, removed, changed, moved] }
                            position: { type: integer }
                            from: { type: integer, description: Where the slide sat before, when it moved. }
                            title: { type: string }
                            added: { type: array, items: { type: string } }
                            removed: { type: array, items: { type: string } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/presentations/{id}/revisions/{revisionId}/restore:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
      - name: revisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restorePresentationRevision
      summary: Restore a presentation checkpoint
      description: The current state is checkpointed first, making the restore itself reversible.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      responses:
        '200':
          description: Presentation restored to the selected checkpoint with a new current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/presentations/{id}/generate:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
    post:
      operationId: generatePresentation
      summary: Queue generation or regeneration
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      responses:
        '202':
          description: Generation is queued and the presentation status is `queued`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/presentations/{id}/source:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: getPresentationSource
      summary: Read the deck as source
      description: |
        Returns the deck written in Ptium's slide language, together with the
        layout ids and component names this template accepts. The source is the
        deck: compiling it produces exactly the stored slides.

        When the slides have been edited on the canvas since the source was
        written, the text is regenerated from them, so the two never disagree.

        The language is documented in `docs/deck-source.md`.
      tags: [Presentations]
      responses:
        '200':
          description: The deck as text.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    properties:
                      source:
                        type: string
                      slideCount:
                        type: integer
                      language:
                        type: string
                      blockKinds:
                        type: array
                        items:
                          type: string
                      layouts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            role:
                              type: string
                              enum: [title, section, content, twoContent, comparison, quote, picture, table, chart, closing, blank]
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: applyPresentationSource
      summary: Compile deck source into slides
      description: |
        Compiles source against the deck's template and replaces its slides.

        Source that asks for something the template cannot do is adjusted rather
        than rejected — a missing layout, a component with no room, text with
        nowhere to go — and every adjustment is reported in `warnings`.

        With `dryRun` the deck is left untouched and only the result is reported,
        which is what an editor uses to check before applying.
      tags: [Presentations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              additionalProperties: false
              properties:
                source:
                  type: string
                  description: The deck in Ptium's slide language.
                dryRun:
                  type: boolean
                  default: false
                version:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Optional expected version when applying. Ignored for a dry run.
      responses:
        '200':
          description: The compiled deck, applied unless this was a dry run.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    properties:
                      applied:
                        type: boolean
                      warnings:
                        type: array
                        items:
                          type: string
                      presentation:
                        $ref: '#/components/schemas/Presentation'
                      slides:
                        type: array
                        description: Present on a dry run only.
                        items:
                          $ref: '#/components/schemas/Slide'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The source produced no slides, more than the limit, or is not text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/presentations/{id}/source/preview.svg:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    post:
      operationId: previewPresentationSource
      summary: Render one slide of unsaved deck source
      description: |
        Compiles source and draws one slide through the deck's template without
        storing anything. This is what an editor calls while someone is typing.

        The compiled slide count is returned in `X-Ptium-Slide-Count`, so a client
        can page through a deck that does not exist yet.
      tags: [Presentations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
      responses:
        '200':
          description: The rendered slide.
          headers:
            X-Ptium-Slide-Count:
              description: How many slides the source compiles to.
              schema:
                type: integer
          content:
            image/svg+xml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The source produced no slides or is not text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/presentations/{id}/inspect:
    parameters:
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: inspectPresentation
      summary: Measure a deck as it will be drawn
      description: |
        Answers the question someone would otherwise answer by exporting the file
        and looking at every slide: does anything overflow, collide, fall off the
        edge, or become unreadable.

        The same measurements run inside every source compile, whose response
        carries `findings` beside its warnings.
      tags: [Presentations]
      responses:
        '200':
          description: What the deck looks like once drawn.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    properties:
                      slides:
                        type: integer
                      clean:
                        type: boolean
                        description: True when no defect was found; advisories do not affect it.
                      defects:
                        type: integer
                      advisories:
                        type: integer
                      findings:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeckFinding'
                      score:
                        $ref: '#/components/schemas/DeckScore'
                  requestId:
                    $ref: '#/components/schemas/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The deck has no slides to measure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/presentations/{id}/export:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
    get:
      operationId: exportPresentation
      summary: Export a presentation as PowerPoint
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:read]
      parameters:
        - name: format
          in: query
          required: false
          description: Export format. PPTX is the only supported value and is the default.
          schema:
            type: string
            enum: [pptx]
            default: pptx
      responses:
        '200':
          description: PowerPoint presentation file.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Content-Disposition:
              description: Attachment filename derived from the presentation title.
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/presentations/{id}/preview.svg:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
    get:
      operationId: previewPresentationSlide
      summary: Render one slide as SVG
      description: |
        Draws a slide using the template's real geometry, palette and
        typography so a client can show what the exported file will look like
        without a PowerPoint engine. The rendering reflects the persisted
        slide, not unsaved edits.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:read]
      parameters:
        - name: slide
          in: query
          required: false
          description: 1-based slide position. Defaults to the first slide.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: freeform
          in: query
          required: false
          description: Set to `false` to render only the template-bound base layer for a direct-manipulation canvas.
          schema:
            type: boolean
            default: true
        - name: only
          in: query
          required: false
          description: |
            Draw one region alone, on a transparent page with no template
            background or artwork. A canvas uses it to lift a region off the
            slide and drag the real drawing rather than an outline over a stale
            copy of it.
          schema:
            type: string
            maxLength: 100
        - name: exclude
          in: query
          required: false
          description: Comma-separated slots to leave out, so a region being moved is not drawn twice.
          schema:
            type: string
        - $ref: '#/components/parameters/PreviewWidth'
      responses:
        '200':
          description: Scalable vector rendering of the requested slide.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            image/svg+xml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/presentations/{id}/slides/{position}/regions:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/SlidePosition'
    get:
      operationId: listSlideRegions
      summary: Describe one slide's regions as editable objects
      description: |
        Returns every region of a drawn slide: where it draws, what it holds and
        how it is styled. Without this a generated slide is a picture to an
        editor, and the only thing anyone can do to a picture is draw on top of
        it.

        Frames are percentages of the slide. `slideHeightPoints` is the slide's
        height in points, so a browser can size type the way the renderer does
        whatever pixel width it draws at.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:read]
      responses:
        '200':
          description: The slide's regions, in the layout's own order.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      slide: { type: integer }
                      layoutId: { type: string }
                      layoutName: { type: string }
                      aspectRatio: { type: number }
                      slideHeightPoints: { type: number }
                      regions:
                        type: array
                        items:
                          $ref: '#/components/schemas/CanvasRegion'
                  requestId: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/presentations/{id}/slides/{position}/revise:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PresentationID'
      - $ref: '#/components/parameters/SlidePosition'
    post:
      operationId: reviseSlide
      summary: Ask the model for another draft of one slide
      description: |
        Rewrites a single slide and returns the proposal without storing it. It
        is scoped to one slide on purpose: regenerating a deck to fix one
        sentence throws away every edit made since, which is why people stop
        editing generated decks and start rewriting them elsewhere.

        The model is given the slide as source, the capacity of every region of
        its layout, the titles of the deck around it, and whatever inspection
        measured about it — an overflow reported in centimetres is something a
        rewrite can aim at. Objects the author placed and regions they moved are
        carried onto the proposal.
      tags: [Presentations]
      x-ptium-api-key-scopes: [presentations:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [rewrite, shorten, expand, component, notes, fit]
                  default: rewrite
                instruction:
                  type: string
                  maxLength: 2000
                  description: What the author asked for, in their own words.
                slot:
                  type: string
                  maxLength: 100
                  description: Narrows the rewrite to one region of the slide.
      responses:
        '200':
          description: The proposed slide. Nothing has been saved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      slide: { type: integer }
                      source:
                        type: string
                        description: The revised slide in the deck source language.
                      proposal:
                        $ref: '#/components/schemas/Slide'
                      warnings:
                        type: array
                        items: { type: string }
                      findings:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeckFinding'
                      applied:
                        type: boolean
                        enum: [false]
                  requestId: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          description: The AI provider answered with something that could not be used.
        '503':
          description: This deployment has no AI provider configured.

  /api/v1/templates:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
    get:
      operationId: listTemplates
      summary: List usable PowerPoint templates
      description: |
        Returns the caller's own uploads together with every template shared
        with the organisation and every built-in design. List records omit the
        full manifest; read a single template to obtain its layouts.
      tags: [Templates]
      x-ptium-api-key-scopes: [templates:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Templates ordered with uploads first, then built-in designs.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTemplate
      summary: Upload a PowerPoint template
      description: |
        Accepts a `.pptx` or `.potx` package as either a multipart form or a raw
        request body with metadata in the query string. The package is analyzed
        on upload: its masters, layouts, theme and placeholder geometry are
        catalogued, and the original file is stored unchanged for export.
      tags: [Templates]
      x-ptium-api-key-scopes: [templates:write]
      parameters:
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: description
          in: query
          required: false
          schema: { type: string, maxLength: 1000 }
        - name: filename
          in: query
          required: false
          description: Required when the body is raw so the extension can be validated.
          schema: { type: string, maxLength: 200 }
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [private, shared]
            default: private
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                  maxLength: 120
                description:
                  type: string
                  maxLength: 1000
                scope:
                  type: string
                  enum: [private, shared]
          application/vnd.openxmlformats-officedocument.presentationml.presentation:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Template stored and analyzed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Template uploads are disabled by the administrator.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: The upload exceeds the configured template size limit.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/templates/{id}:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/TemplateID'
    get:
      operationId: getTemplate
      summary: Read a template and its layout catalogue
      tags: [Templates]
      x-ptium-api-key-scopes: [templates:read]
      responses:
        '200':
