    post:
      operationId: createAPIKey
      summary: Create an API key
      description: |
        The returned `secret` is displayed once and cannot be recovered. If
        scopes are omitted, Ptium grants `presentations:read`,
        `presentations:write`, and `mcp:use`. Administrator scopes can only be
        assigned when the owning user is an administrator.
      tags: [API keys]
      x-ptium-api-key-scopes: [api_keys:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreate'
      responses:
        '201':
          description: API key created; save the one-time secret now.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreatedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/api-keys/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/APIKeyID'
    post:
      operationId: revokeAPIKey
      summary: Revoke an API key immediately
      tags: [API keys]
      x-ptium-api-key-scopes: [api_keys:manage]
      responses:
        '204':
          description: API key revoked. The response has no body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
