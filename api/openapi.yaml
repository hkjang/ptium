  /api/v1/api-keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/APIKeyID'
    post:
      operationId: rotateAPIKey
      summary: Rotate an API key
      description: |
        Creates a replacement key with the same owner, scopes, and expiry. The
        old key remains valid during the grace period, then becomes unusable.
        A zero grace period revokes it immediately. `graceSeconds` takes
        precedence when both grace fields are supplied.
      tags: [API keys]
      x-ptium-api-key-scopes: [api_keys:manage]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyRotate'
      responses:
        '201':
          description: Replacement API key created; save the one-time secret now.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreatedEnvelope'
        '400':
