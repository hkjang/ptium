name: ptium

# Local reference deployment. One Ptium container serves the API, the MCP
# endpoint and the workspace on port 8080; PostgreSQL here is a convenience for
# evaluation, not part of the release image.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ptium}
      POSTGRES_USER: ${POSTGRES_USER:-ptium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptium}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ptium-postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  ptium:
    build:
      context: .
      args:
        VERSION: ${PTIUM_VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ptium}:${POSTGRES_PASSWORD:-ptium}@postgres:5432/${POSTGRES_DB:-ptium}?sslmode=disable
      HTTP_ADDR: :8080
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-admin@example.com}
      BOOTSTRAP_ADMIN_SUBJECTS: ${BOOTSTRAP_ADMIN_SUBJECTS:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ptium-web}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-ptium-web}
      OIDC_ALLOW_HTTP: ${OIDC_ALLOW_HTTP:-false}
      AUTH_ADMIN_ROLES: ${AUTH_ADMIN_ROLES:-ptium-admin,admin}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-local-development-only-change-me}
      DEV_AUTH_EMAIL: ${DEV_AUTH_EMAIL:-developer@example.com}
      DEV_AUTH_NAME: ${DEV_AUTH_NAME:-Ptium Developer}
      DEV_AUTH_ROLES: ${DEV_AUTH_ROLES:-ptium-admin,user}
      DEV_AUTH_ALLOW_REMOTE: ${DEV_AUTH_ALLOW_REMOTE:-true}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PTIUM_PORT:-8080}:8080"

volumes:
  ptium-postgres:
